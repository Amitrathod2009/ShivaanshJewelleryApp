name: TypeScript Validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run TypeScript Compile
        run: npx tsc --noEmit
